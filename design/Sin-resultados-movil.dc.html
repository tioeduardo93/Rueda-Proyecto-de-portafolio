<!doctype html>
<html lang="es">
<head>

<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:var(--accent)}a:hover{color:#0E1A1F}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.noscroll{scrollbar-width:none}.noscroll::-webkit-scrollbar{display:none}
.fade{animation:fu .4s ease both}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 40%,transparent);outline-offset:2px}
</style>
</helmet>
<div style="--accent: {{accent}}; width: 390px; height: 844px; display: flex; flex-direction: column; font-family: 'Manrope', system-ui, sans-serif; color: #0E1A1F; background: #F4F6F6">

<div style="display: flex; align-items: center; justify-content: space-between">

</a>

<input type="search" value="Tesla" style="width: 100%; height: 46px; border-radius: 12px; border: 1px solid #D5DCDF; background: #F7F9F9; padding: 0 14px 0 42px; font: inherit; font-size: 16px; font-weight: 600; color: #0E1A1F">
</label>
<div class="noscroll" style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="3">

<button type="button" style="margin-top: 12px; width: 100%; height: 52px; border-radius: 14px; border: 0; background: var(--accent); color: #fff; font: inherit; font-size: 16px; font-weight: 800">Limpiar filtros</button>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B7A75","options":["#0B7A75","#C2410C","#2B54C9"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#0B7A75', chips: ['Hasta 15.000 €', 'Eléctrico', 'Desde 2022'] };
  }
}
</script>
</body>
</html>
