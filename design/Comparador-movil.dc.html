<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Rueda · Comparador móvil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:var(--accent)}a:hover{color:#0E1A1F}
.num{font-variant-numeric:tabular-nums}
.ph{background-color:#ECF0F0;background-image:repeating-linear-gradient(135deg,rgba(14,26,31,.04) 0 10px,transparent 10px 20px)}
.best{background:color-mix(in srgb,var(--accent) 10%,#fff)!important;color:var(--accent)!important;font-weight:800!important}
.dgt{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-weight:800;font-size:11px;flex:none}
.dgt-eco{background:linear-gradient(90deg,#24803A 50%,#1559B8 50%);color:#fff;font-size:8px}
.dgt-c{background:#24803A;color:#fff}
.hscroll{scrollbar-width:thin}
button:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 40%,transparent);outline-offset:2px}
</style>
</helmet>
<div style="--accent: {{accent}}; width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; font-family: 'Manrope', system-ui, sans-serif; color: #0E1A1F; background: #fff">

<header style="flex: none; padding: 12px 12px 12px 8px; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #E3E7EA">
<a href="Listado-movil.dc.html" aria-label="Volver" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #0E1A1F"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<h1 class="num" style="margin: 0; flex: 1; font-size: 19px; font-weight: 800">Comparar (3/3)</h1>
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #56616B"><span class="best" style="width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--accent)"></span>Mejor valor</span>
</header>

<p style="flex: none; margin: 0; padding: 10px 16px; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #56616B; background: #F7F9F9; border-bottom: 1px solid #EEF1F2">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M14 7l5 5-5 5"></path></svg>
Desliza horizontalmente para ver todos los coches
</p>

<div class="hscroll" role="region" aria-label="Tabla comparativa" style="flex: 1; overflow: auto">
<div style="width: 616px">
<div style="display: flex; position: sticky; top: 0; z-index: 2; background: #fff; border-bottom: 1px solid #E3E7EA">
<div style="width: 100px; flex: none; position: sticky; left: 0; background: #fff; z-index: 3"></div>
<sc-for list="{{cars}}" as="c" hint-placeholder-count="3">
<div style="width: 172px; flex: none; padding: 12px 10px; border-left: 1px solid #EEF1F2; display: flex; flex-direction: column; gap: 8px">
<div class="ph" style="position: relative; aspect-ratio: 4 / 3; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #56616B; text-align: center; padding: 4px">Foto · {{c.n}}
<button type="button" aria-label="Quitar {{c.n}}" style="position: absolute; right: 4px; top: 4px; width: 32px; height: 32px; border-radius: 50%; border: 0; background: rgba(255,255,255,0.95); color: #0E1A1F; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<span style="font-size: 14px; font-weight: 800; line-height: 1.2">{{c.n}}</span>
<span class="num" style="font-size: 19px; font-weight: 800; letter-spacing: -0.02em">{{c.p}}</span>
</div>
</sc-for>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
<div style="display: flex; border-bottom: 1px solid #EEF1F2">
<div style="width: 100px; flex: none; position: sticky; left: 0; z-index: 1; background: #F7F9F9; padding: 12px; font-size: 12px; font-weight: 700; color: #33404A; display: flex; align-items: center; box-shadow: 1px 0 0 #EEF1F2">{{r.label}}</div>
<sc-for list="{{r.cells}}" as="cell" hint-placeholder-count="3">
<div class="num {{cell.cls}}" style="width: 172px; flex: none; padding: 12px 10px; border-left: 1px solid #EEF1F2; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; flex-wrap: wrap">
<sc-if value="{{cell.dgt}}" hint-placeholder-val="{{ false }}"><span class="dgt dgt-{{cell.key}}">{{cell.t}}</span></sc-if>
<sc-if value="{{cell.plain}}" hint-placeholder-val="{{ true }}"><span>{{cell.t}}</span></sc-if>
<sc-if value="{{cell.best}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-label="Mejor valor" role="img"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
</div>
</sc-for>
</div>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B7A75","options":["#0B7A75","#C2410C","#2B54C9"]},"$preview":{"width":390,"height":844}}'>
const CARS = [
  {n:'SEAT León',precio:18990,cuota:236,anio:2021,km:48200,cv:150,consumo:5.7,maletero:380,comb:'Gasolina',cambio:'Manual',dgt:'C'},
  {n:'Toyota C-HR',precio:21900,cuota:273,anio:2021,km:52000,cv:122,consumo:4.9,maletero:377,comb:'Híbrido',cambio:'Automático',dgt:'ECO'},
  {n:'Peugeot 3008',precio:19750,cuota:246,anio:2020,km:66300,cv:130,consumo:6.1,maletero:520,comb:'Gasolina',cambio:'Automático',dgt:'C'}
];
const fmt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const RANK = {'0':4,'ECO':3,'C':2,'B':1};
const ROWS = [
  ['Precio','precio',v=>fmt(v)+' €','min'],['Cuota','cuota',v=>v+' €/mes','min'],['Año','anio',v=>String(v),'max'],
  ['Kilómetros','km',v=>fmt(v)+' km','min'],['Potencia','cv',v=>v+' CV','max'],['Consumo','consumo',v=>String(v).replace('.',',')+' l/100','min'],
  ['Maletero','maletero',v=>v+' l','max'],['Combustible','comb',v=>v,null],['Cambio','cambio',v=>v,null],['Etiqueta','dgt',v=>v,'max']
];

class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#0B7A75';
    return {
      accent,
      cars: CARS.map(c => ({n: c.n, p: fmt(c.precio) + ' €'})),
      rows: ROWS.map(([label, k, txt, best]) => {
        const vals = CARS.map(c => c[k]), sc = vals.map(v => k === 'dgt' ? RANK[v] : v);
        const t = best ? (best === 'min' ? Math.min(...sc) : Math.max(...sc)) : null;
        const same = vals.every(v => v === vals[0]);
        return {label, cells: vals.map((v, i) => { const b = t !== null && !same && sc[i] === t; return {t: txt(v), best: b, cls: b ? 'best' : '', dgt: k === 'dgt', plain: k !== 'dgt', key: String(v).toLowerCase()}; })};
      })
    };
  }
}
</script>
</body>
</html>
